# Notifuse with AlloyDB Omni instead of vanilla PostgreSQL.
#
# AlloyDB Omni is Google's PostgreSQL-compatible database with an in-memory
# columnar engine that dramatically accelerates analytical scans — exactly the
# ad-hoc GROUP BY aggregations the web analytics feature runs over
# web_sessions / web_pages / web_goals. Use this compose file when your
# workspaces track enough traffic that dashboard queries on vanilla Postgres
# feel slow (tens of millions of sessions per month).
#
# Notes:
#   - AlloyDB Omni 17.x is PostgreSQL-17 compatible; every Notifuse feature
#     works unchanged (the schema deliberately uses no PG18-only DDL).
#   - The columnar engine caches hot columns automatically. Historical monthly
#     partitions are immutable, so they columnarize extremely well; only the
#     current month keeps taking upserts.
#   - Licensing: AlloyDB Omni ships under Google's own terms; review them
#     before production use. See https://cloud.google.com/alloydb/omni
#
# This variant builds from source like compose.yaml. For a production install
# on vanilla PostgreSQL, use compose.prod.yaml instead.
#
# Usage: docker compose -f compose.alloydb.yaml up -d

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${HTTP_PORT:-8081}:8080'
      - '${SMTP_BRIDGE_HOST_PORT:-587}:587'
    env_file:
      - path: .env
        required: false
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - ENVIRONMENT=${ENVIRONMENT:-production}

      - DB_HOST=${DB_HOST:-alloydb}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_PREFIX=${DB_PREFIX:-notifuse}
      - DB_NAME=${DB_NAME:-notifuse_system}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      - 'SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required. Generate one with: openssl rand -base64 32, then add it to .env}'

      # Notifuse licence key (Optional). Leaving it unset is the ordinary state
      # of a self-hosted installation and means the free tier. It overrides any
      # key pasted in the console under Settings > Licence. See env.example for
      # what a licence covers and where a key comes from.
      # - NOTIFUSE_LICENSE_KEY=${NOTIFUSE_LICENSE_KEY}

      # Web analytics geo dimensions use the GeoLite2 City database shipped in
      # the image. Override it with a fresher copy by dropping it in ./data as
      # GeoLite2-City.mmdb, or by setting an explicit path here.
      # - GEOIP_DB_PATH=/app/data/GeoLite2-City.mmdb
    depends_on:
      alloydb:
        condition: service_healthy
        restart: true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # cmd/api/main.go asks for 65s of graceful shutdown inside a 70s context:
    # it drains the web analytics buffer, stops the task and automation
    # schedulers and the email queue worker. Docker's default grace period is
    # 10s, which SIGKILLs the server in the middle of all of that.
    stop_grace_period: 75s
    networks:
      - notifuse-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:$${SERVER_PORT:-8080}/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  alloydb:
    image: google/alloydbomni:17.5.0
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    command:
      - '-c'
      - 'google_columnar_engine.enabled=on'
      # Memory reserved for the columnar store, in MB. Size it to hold your
      # hottest web analytics partitions.
      - '-c'
      - 'google_columnar_engine.memory_size_in_mb=1024'
    volumes:
      - alloydb-data:/var/lib/postgresql/data
    # The columnar engine scans in parallel; 64 MB of /dev/shm is not enough for
    # the workload this file exists to speed up.
    shm_size: 512mb
    restart: unless-stopped
    # SIGTERM is a *smart* shutdown in PostgreSQL: it waits for clients to
    # disconnect, and Docker's default 10s grace period turns that into a
    # SIGKILL and a recovery on next boot.
    stop_grace_period: 1m
    networks:
      - notifuse-network
    healthcheck:
      # Follows POSTGRES_USER/POSTGRES_DB rather than assuming `postgres`.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"']
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 1s

volumes:
  alloydb-data:
    driver: local

networks:
  notifuse-network:
    driver: bridge
