services:
  postgres-test:
    # Deliberately the oldest supported PostgreSQL: 17 is the compatibility
    # floor, set by AlloyDB Omni, and CI runs it. All DDL must stay valid here
    # although compose.yaml ships 18. To run the suite on 18:
    #   POSTGRES_TEST_IMAGE=postgres:18-alpine docker compose -f tests/compose.test.yaml up -d --force-recreate
    image: ${POSTGRES_TEST_IMAGE:-postgres:17}
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=300'
      - '-c'
      - 'shared_buffers=128MB'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: notifuse_test
      POSTGRES_PASSWORD: test_password
    ports:
      - '5433:5432'
    volumes:
      # The parent of both images' data directories (17: data, 18: 18/docker), so
      # either image runs on it. A volume made by the earlier mount at
      # /var/lib/postgresql/data starts a new test database: the old one stays
      # unused at the volume root until `docker compose -f tests/compose.test.yaml down -v`.
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifuse_test -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_test_data:
    driver: local
