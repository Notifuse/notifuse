<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex">
  <!-- No icon or manifest link here: the bootstrap below adds them for the identity config.js
       resolved, so a branded instance never flashes the Notifuse icon. -->
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console</title>
  <style>
    body {
      margin: 0;
    }

    .preload-splash {
      min-height: 100vh;
      /* background: linear-gradient(to right, #512DA8, #673AB7); */
      padding-bottom: 64px;
    }

    .preload-splash-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      padding: 64px 16px;
    }

    .preload-splash-logo {
      display: block;
      max-width: 150px;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .preload-splash-name {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 600 20px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #374151;
    }

    .preload-splash-content {
      text-align: center;
    }

    .preload-icon {
      display: inline-block;
      color: inherit;
      font-style: normal;
      line-height: 0;
      text-align: center;
      text-transform: none;
      vertical-align: -0.125em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 60px;
    }

    .preload-icon-spin {
      display: inline-block;
      -webkit-animation: loadingCircle 1s infinite linear;
      animation: loadingCircle 1s infinite linear;
    }

    @keyframes loadingCircle {
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    // Load config.js with cache-busting to ensure fresh configuration after setup
    document.write('<script src="/config.js?_t=' + Date.now() + '"><\/script>');
  </script>
  <script>
    // Paints the instance identity before React: title, icons, manifest, then the splash.
    // config.js resolved it (window.INSTANCE_BRANDING), licence included; a config.js that
    // predates branding, or did not load, leaves the Notifuse identity. Plain ES5 on purpose:
    // it runs before any bundle. src/components/brand/InstanceLogo.tsx follows the same rules.
    (function () {
      var defaults = {
        custom: false,
        name: 'Notifuse',
        icon_url: '',
        splash_logo_src: '/console/logo.png',
        favicon_src: '/console/favicon-32x32.png'
      };
      var served = window.INSTANCE_BRANDING;
      var brand = served && typeof served === 'object' ? served : {};
      function get(key) {
        return brand[key] !== undefined && brand[key] !== null ? brand[key] : defaults[key];
      }
      var custom = get('custom') === true;
      var name = get('name') || defaults.name;
      document.title = 'Console | ' + name;

      function addLink(rel, href, attributes) {
        var link = document.createElement('link');
        link.rel = rel;
        link.href = href;
        for (var key in attributes || {}) link.setAttribute(key, attributes[key]);
        document.head.appendChild(link);
        return link;
      }

      // A custom brand starts on the neutral icon (favicon_src): a browser does not reliably
      // report a favicon that fails, so the configured icon replaces it only once it loaded.
      var favicon = addLink('icon', get('favicon_src'), custom ? {} : { type: 'image/png', sizes: '32x32' });
      if (custom) {
        addLink('apple-touch-icon', get('icon_url') || '/console/neutral-icon.png');
      } else {
        addLink('icon', '/console/favicon-16x16.png', { type: 'image/png', sizes: '16x16' });
        addLink('apple-touch-icon', '/console/apple-touch-icon.png', { sizes: '180x180' });
        addLink('mask-icon', '/console/safari-pinned-tab.svg', { color: '#5bbad5' });
      }
      addLink('manifest', '/console/instance.webmanifest');

      var iconUrl = custom ? get('icon_url') : '';
      if (iconUrl) {
        var settled = false;
        var probe = new Image();
        var timer = setTimeout(function () {
          settled = true;
        }, 5000);
        probe.referrerPolicy = 'no-referrer';
        probe.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          favicon.href = iconUrl;
        };
        probe.onerror = function () {
          settled = true;
          clearTimeout(timer);
        };
        probe.src = iconUrl;
      }

      function nameText() {
        var text = document.createElement('span');
        text.className = 'preload-splash-name';
        text.textContent = name;
        return text;
      }

      // Called by the script right after the splash container, before the React module runs.
      window.hydrateInstanceSplash = function () {
        var box = document.getElementById('preload-brand');
        if (!box || box.firstChild) return;
        var src = get('splash_logo_src');
        if (!src) {
          box.appendChild(nameText());
          return;
        }
        var logo = document.createElement('img');
        logo.className = 'preload-splash-logo';
        logo.alt = name;
        logo.referrerPolicy = 'no-referrer';
        logo.onerror = function () {
          if (logo.parentNode === box) box.replaceChild(nameText(), logo);
        };
        logo.src = src;
        box.appendChild(logo);
      };
    })();
  </script>
</head>

<body>
  <div id="root">
    <div class="preload-splash">
      <div id="preload-brand" class="preload-splash-brand"></div>
      <script>
        window.hydrateInstanceSplash && window.hydrateInstanceSplash();
      </script>

      <div class="preload-splash-content">
        <i aria-label="icon: loading" class="preload-icon preload-icon-loading"><svg viewBox="0 0 1024 1024"
            class="preload-icon-spin" data-icon="loading" width="1em" height="1em" fill="#000000" aria-hidden="true"
            focusable="false">
            <path
              d="M988 548c-19.9 0-36-16.1-36-36 0-59.4-11.6-117-34.6-171.3a440.45 440.45 0 0 0-94.3-139.9 437.71 437.71 0 0 0-139.9-94.3C629 83.6 571.4 72 512 72c-19.9 0-36-16.1-36-36s16.1-36 36-36c69.1 0 136.2 13.5 199.3 40.3C772.3 66 827 103 874 150c47 47 83.9 101.8 109.7 162.7 26.7 63.1 40.2 130.2 40.2 199.3.1 19.9-16 36-35.9 36z">
            </path>
          </svg></i>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
