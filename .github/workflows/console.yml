name: Console

# The console had no CI at all, and its own build script could not have caught a
# type error anyway: package.json ran a bare `tsc`, which resolves to the root
# tsconfig.json — a solution file with `"files": []` and nothing but references.
# That reports success without reading a single source file. Only `tsc -b` walks
# the referenced projects. Between the two, 293 type errors accumulated silently
# and `npm run build` stayed green the whole time, including inside the release
# image (Dockerfile stage 1 runs `npm run build`).
# The path list is duplicated rather than shared through a YAML anchor:
# GitHub Actions does not support anchors or aliases in workflow files.
on:
  push:
    branches: [dev, main]
    paths:
      - 'console/**'
      # the display condition cases shared with the Go evaluator
      - 'pkg/notifuse_mjml/testdata/**'
      - '.github/workflows/console.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'console/**'
      # the display condition cases shared with the Go evaluator
      - 'pkg/notifuse_mjml/testdata/**'
      - '.github/workflows/console.yml'

jobs:
  # Type-check, lint and build run beside the unit tests rather than before them:
  # none depends on another, and the tests are most of the time.
  checks:
    name: Type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./console

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the console builder stage in the Dockerfile, so a build that
          # passes here is the same build that ships.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Run explicitly, and before the build, so the failure this workflow exists
      # to catch reports itself as a type error rather than as a build failure.
      # `-b` is load-bearing: a bare `tsc` here checks nothing at all.
      - name: Type-check
        run: npx tsc -b

      # `npm run lint` passes --max-warnings 0: a warning fails the job like an error.
      - name: Lint
        run: npm run lint

      # The full production pipeline (tsc -b -> vite build), which is what Dockerfile
      # stage 1 runs. Catches catalog and bundler failures that a type-check alone
      # cannot see: @lingui/vite-plugin fails the build on a catalog message that does
      # not compile (failOnCompileError in vite.config.ts).
      - name: Production build
        run: npm run build

  # The unit tests run as four jobs. Each test file re-imports the app and antd in
  # its own isolated worker, so the suite's time is mostly a per-file cost that a
  # 4-vCPU runner can only run a few at a time; vitest's --shard splits the files
  # between jobs, every file in exactly one.
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./console
    strategy:
      fail-fast: false
      matrix:
        # Must count 1..N: the shard total is taken from the number of entries, so
        # adding or removing one re-splits the files instead of skipping some.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # One check to read and to require, whatever the number of shards. Named after
  # the workflow: the single job's old name is also a job in notification-center.yml,
  # and two checks with one name cannot be told apart by a required-check rule.
  result:
    name: Console checks
    runs-on: ubuntu-latest
    needs: [checks, unit-tests]
    if: always()
    steps:
      - name: Every job passed
        run: |
          echo "checks: ${{ needs.checks.result }}, unit tests: ${{ needs.unit-tests.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
