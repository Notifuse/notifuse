name: Go

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go get github.com/DATA-DOG/go-sqlmock

      - name: Run unit tests and generate coverage
        run: |
          # Create a test .env file
          echo "SECRET_KEY=mytestsecretkey" >> .env.test
          echo "ROOT_EMAIL=admin@example.com" >> .env.test

          # Run unit tests (exclude integration tests)
          go test -race -coverprofile=coverage-unit.txt -covermode=atomic $(go list ./... | grep -v '/tests/integration') -v

      # pkg/license/pubkey_dev.go is compiled only under this tag. Without this step
      # nothing in CI ever builds it, so the dev signing key could rot unnoticed — and
      # the end-to-end licence tests would keep running their fail-safe branch instead
      # of the one that actually verifies a minted grant.
      - name: Run the licence tests under the dev signing key
        run: make test-licence-dev

      # telemetry/ is a second Go module: the step above lists packages from the root
      # module only, so it never reaches it. Its tests are what keep the receiver's
      # structs in step with the BigQuery schema.
      - name: Run the telemetry receiver tests
        run: make test-telemetry

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Notifuse/notifuse
          files: coverage-unit.txt
          fail_ci_if_error: false
          verbose: true
          name: codecov-unit-tests
          flags: unit


  # The integration suite is one package whose tests run one after the other, so it
  # runs as several jobs, each on its own Postgres and Mailpit. Tests cannot share
  # them: many clear every Mailpit message, and some workspaces have fixed IDs.
  # tests/shard splits the tests by their measured durations
  # (tests/integration/testdata/durations.json, rebuilt with
  # `make integration-durations`); every listed test runs in exactly one job,
  # including tests the durations file does not know.
  integration-tests:
    name: Integration Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    services:
      postgres:
        # Same major version as tests/compose.test.yaml and the documented
        # production target, so CI exercises the SQL we actually ship against.
        image: postgres:17
        env:
          POSTGRES_USER: notifuse_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres

        options: >-
          --health-cmd "pg_isready -U notifuse_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_MAX_MESSAGES: 2000
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8025/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go get github.com/DATA-DOG/go-sqlmock

      # -tags integration pulls in the scheduler/dispatch suite. Without the flag
      # those files build out and the HTTP dispatch branch and the lease reap go
      # completely untested.
      #
      # -tags licdev makes the binary trust the committed dev signing key, so the
      # enterprise licence the harness mints (tests/testutil/license.go) verifies
      # and the suite runs with every gate open. A release-keyed build refuses that
      # licence, degrades to the free tier and fails seven suites on a 402 at the
      # fourth workspace; the harness detects that build and refuses to start
      # rather than run degraded.
      - name: Build the integration test binary
        run: go test -c -race -tags integration,licdev -o integ.test ./tests/integration

      - name: Pick this shard's tests
        shell: bash
        run: |
          go build -o shard-tool ./tests/shard
          ./integ.test -test.list '.*' > all-tests.txt
          ./shard-tool assign -shards 4 -index ${{ matrix.shard }} \
            -durations tests/integration/testdata/durations.json < all-tests.txt > shard-pattern.txt
          ./shard-tool assign -shards 4 -index ${{ matrix.shard }} -format names \
            -durations tests/integration/testdata/durations.json < all-tests.txt > shard-tests.txt
          echo "$(wc -l < shard-tests.txt) of $(wc -l < all-tests.txt) tests in this shard:"
          cat shard-tests.txt

      - name: Run integration tests
        env:
          # Enable integration tests
          INTEGRATION_TESTS: true
          # Test database configuration
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: notifuse_test
          TEST_DB_PASSWORD: test_password
          ENVIRONMENT: test
          # Set main database config to use test database
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: notifuse_test
          DB_PASSWORD: test_password
          DB_NAME: notifuse_test_integration
          DB_PREFIX: notifuse_test
          DB_SSLMODE: disable
        # Naming the shell is what turns on pipefail: an unnamed shell runs
        # `bash -e {0}`, where the tee below would hide a failing test.
        shell: bash
        run: |
          set -o pipefail
          # Create a test .env file for integration tests
          echo "SECRET_KEY=UayDa4OMDpm3CvIT+iSC39iDyPlsui0pNQYDEZ1pbo1LsIrO4p/aVuCBWz6LiYvzj9pc+gn0gLwRd0CoHV+nxw==" >> .env.test
          echo "ROOT_EMAIL=admin@example.com" >> .env.test
          echo "DB_HOST=localhost" >> .env.test
          echo "DB_PORT=5433" >> .env.test
          echo "DB_USER=notifuse_test" >> .env.test
          echo "DB_PASSWORD=test_password" >> .env.test
          echo "DB_NAME=notifuse_test_integration" >> .env.test
          echo "DB_PREFIX=notifuse_test" >> .env.test
          echo "DB_SSLMODE=disable" >> .env.test

          # Wait for services to be ready
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10

          # Wait for Mailpit to be ready
          echo "Waiting for Mailpit to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8025/ > /dev/null 2>&1; then
              echo "Mailpit is ready!"
              break
            fi
            echo "Waiting for Mailpit... ($i/30)"
            sleep 2
          done

          # The binary runs from the package directory, as `go test` would: tests
          # read testdata/ by relative path. Slow hosted runners have been seen
          # inflating identical tests by 40-125%; 30m leaves that margin over a
          # shard's ~8m. pipefail (above) makes a failing test fail the step
          # through tee.
          #
          # No coverage profile: its Codecov upload was already disabled. Turning
          # it back on needs -test.coverprofile per shard (and -cover at build)
          # plus a merge of the four profiles.
          cd tests/integration
          ../../integ.test -test.run "$(cat ../../shard-pattern.txt)" -test.v -test.timeout 30m 2>&1 | tee ../../shard-output.txt

      # A panic or a timeout stops the binary and every test after it never runs,
      # which the step above reports only as one failure. This names the tests the
      # shard was given and did not start, so a run is never read as complete when
      # it was not.
      - name: Check every test of the shard ran
        if: always()
        shell: bash
        run: |
          test -f shard-tests.txt || { echo "the shard's test list was never built"; exit 1; }
          test -f shard-output.txt || { echo "the tests never ran"; exit 1; }
          # Not anchored at the start: stderr is merged into the log, and a line
          # written without a newline can end up in front of a RUN line.
          grep -oE '=== RUN   Test[A-Za-z0-9_]+$' shard-output.txt | sed 's/^=== RUN   //' | sort -u > ran.txt
          sort -u shard-tests.txt > expected.txt
          comm -23 expected.txt ran.txt > not-run.txt
          if [ -s not-run.txt ]; then
            echo "$(wc -l < not-run.txt) tests of this shard never started:"
            cat not-run.txt
            exit 1
          fi
          echo "All $(wc -l < expected.txt) tests of this shard started."

  # One check to read and to require, whatever the number of shards.
  integration-tests-result:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.integration-tests.result }}"
          test "${{ needs.integration-tests.result }}" = "success"
