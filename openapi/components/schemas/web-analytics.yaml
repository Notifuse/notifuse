WebTrackPayload:
  type: object
  required: [workspace_id, session_id, actions, updated_at]
  properties:
    workspace_id:
      type: string
    session_id:
      type: string
      description: >-
        Client-generated UUIDv7. Its embedded timestamp is the single source of
        truth for the session start and for the partition the rows land in, and
        must fall within [now-48h, now+24h]. The past bound is the wider one
        because a session can keep beating for 24h after it started and the SDK
        offline queue holds beats for another 24h; the future bound is the same
        24h as the other timestamps, since the id is minted from the device
        clock and a visitor whose clock runs fast inherits the whole skew.
    actions:
      type: array
      maxItems: 1000
      description: >-
        The FULL cumulative list of session actions (re-sent on every beat).


        Two rules apply here and they are easy to conflate. One ACTION that
        breaks its own bounds is DROPPED on its own and the rest of the beat is
        still recorded — never a 400, because the list is cumulative and
        rejecting the beat would reject every later beat of that session too,
        permanently. The LIST exceeding maxItems is the opposite: it is a 400
        for the whole beat, and because actions[] only ever grows, every later
        beat fails the same way until the client trims its oldest actions or
        rotates the session — the same remedy as the 413.
      items:
        oneOf:
          - $ref: '#/WebPageviewAction'
          - $ref: '#/WebGoalAction'
    attributes:
      $ref: '#/WebSessionAttributes'
    created_at:
      type: integer
      format: int64
      description: >-
        Session creation, epoch ms. Optional, and never read: the session start
        comes from the UUIDv7 session_id instead, so a stored session start can
        never disagree with the partition its rows landed in. Accepted for wire
        compatibility with SDKs that still send it, discarded on arrival — not
        listed as required, so a generated client is not forced to invent a
        value the server throws away.
    updated_at:
      type: integer
      format: int64
      description: Beat timestamp, epoch ms; must be within 24h of server time.
    sdk_version:
      type: string
    tab_id:
      type: integer
      format: int64
      description: >-
        The writing tab. Tabs share a session id but keep their own cumulative
        actions and their own seq, so they are disjoint writers. Absent (or 0)
        from an older SDK.
    sent_at:
      type: integer
      format: int64
      description: Stamped at each HTTP attempt; drives clock-skew correction beyond 5s.
    contact_email:
      type: string
      maxLength: 255
      description: >-
        Contact address claimed for this session, signed by contact_email_hmac.
        /track is public and unauthenticated, so no identity field is believed
        until it verifies against the workspace secret. Send either this pair or
        identify_token, never both.


        A valid signature is necessary but NOT sufficient: the identified path
        is rate limited, and the address must already be a contact in the
        workspace. Both extra gates are described under the /track operation.
        Every rejection along the way — bad signature, throttled, unknown
        address — costs the identity only: the beat is still recorded, just
        anonymously, and the response is the same 200 with no error. There is
        nothing on the wire distinguishing a working integration from a broken
        one, so verify against a contact that exists and check that the session
        actually shows up identified.
    contact_email_hmac:
      type: string
      maxLength: 64
      description: >-
        HMAC-SHA-256 of a DOMAIN-SEPARATED string, minted on the customer's
        server (never in the browser, which would hand the workspace secret to
        every visitor). The exact recipe, which must be followed literally:


        signature = lowercase_hex( HMAC_SHA256( key = workspace secret key,
        message = "wa_identify:" + contact_email ) )


        The message is the ASCII prefix "wa_identify:" concatenated with the
        address — signing bare "alice@example.com" instead of
        "wa_identify:alice@example.com" is the failure mode to check first. The
        result is the 64 lowercase hex characters of the digest, compared as
        bytes, so uppercase hex or base64 will not match.


        The prefix exists to keep this credential from being interchangeable
        with the email HMAC that authorizes subscription changes (notification
        center, unsubscribe, one-click), which is computed over the bare address
        with the same workspace secret and is printed into every email Notifuse
        sends. Without the prefix, an unsubscribe HMAC scraped from a forwarded
        email would silently identify a visitor, and this analytics credential
        lifted out of page JS by any third-party script would let its holder
        change that contact's subscriptions.


        Signed and verified over the RAW address exactly as it appears in
        contact_email, before any normalization: sign the same bytes you send.
        Normalization (trim, lowercase) happens only after the signature checks
        out, to match the stored contact.
    identify_token:
      type: string
      maxLength: 3174
      description: >-
        Opaque encrypted credential carried by an email-click link (the nf_id
        parameter), and the alternative to the contact_email /
        contact_email_hmac pair rather than a companion to it. Expired or
        undecryptable tokens cost the identity only, not the beat. Once
        decrypted, the address it carries passes through the same two further
        gates as a signed contact_email (rate limit, then contact-must-exist).


        The length limit is a ceiling on what the server will look at, not a
        size to aim for: it is derived from the longest address contacts can
        store, so that no token Notifuse mints can ever exceed it. Send the
        nf_id value back exactly as it arrived — a longer one is discarded
        before decryption, which costs the identity silently.
    dimensions:
      type: object
      additionalProperties:
        type: string
      description: Custom dimensions custom_1..custom_10.
    seq:
      type: integer
      format: int64
      minimum: 0
      description: Monotonic per-session beat counter; the server only applies strictly newer beats.

WebPageviewAction:
  type: object
  description: >-
    One pageview of the cumulative action list. Breaking any bound below drops
    this action alone; the rest of the beat is still accepted.
  required: [type, path, page_number]
  properties:
    type:
      type: string
      enum: [pageview]
    path:
      type: string
      maxLength: 2048
    page_number:
      type: integer
      minimum: 1
      maximum: 1000
    duration:
      type: integer
      format: int64
      minimum: 0
      maximum: 86400000
      description: >-
        Engaged (visible and focused) time on the page, ms. Capped at a day,
        which is more engaged time than one page can plausibly collect.
    scroll:
      type: integer
      minimum: 0
      maximum: 100
    entered_at:
      type: integer
      format: int64
      minimum: 0
      maximum: 100000000000000
      description: >-
        Epoch ms, bounded to what a timestamp column can hold rather than to a
        window: a replayed offline beat legitimately carries an old timestamp.
    exited_at:
      type: integer
      format: int64
      minimum: 0
      maximum: 100000000000000
      description: Epoch ms; when both are set, must be >= entered_at.

WebGoalAction:
  type: object
  description: >-
    One conversion of the cumulative action list. Breaking any bound below
    drops this action alone; the rest of the beat is still accepted.
  required: [type, name, path, page_number, timestamp]
  properties:
    type:
      type: string
      enum: [goal]
    name:
      type: string
      maxLength: 100
    path:
      type: string
      maxLength: 2048
    page_number:
      type: integer
      minimum: 1
      maximum: 1000
    timestamp:
      type: integer
      format: int64
      minimum: 1
      maximum: 100000000000000
      description: >-
        Original client timestamp in epoch ms; part of the goal's dedup key, so
        a retried beat lands on the same row. Bounded to what a timestamp
        column can hold, not to a window.
    value:
      type: number
      minimum: 0
      maximum: 1000000000000
    properties:
      type: object
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 1024
      description: >-
        At most 50 keys, 1024 characters per value and 8 KB in total: the
        action list is cumulative, so an unbounded map is re-sent forever and
        would eventually push the body past the 1 MB limit.

WebSessionAttributes:
  type: object
  required: [landing_page]
  properties:
    referrer:
      type: string
    landing_page:
      type: string
    utm_source: { type: string }
    utm_medium: { type: string }
    utm_campaign: { type: string }
    utm_term: { type: string }
    utm_content: { type: string }
    utm_id: { type: string }
    utm_id_from: { type: string }
    screen_width: { type: integer }
    screen_height: { type: integer }
    viewport_width: { type: integer }
    viewport_height: { type: integer }
    device:
      type: string
      description: >-
        Device class, one of desktop, mobile or tablet. Detected IN THE BROWSER
        by the SDK, not re-parsed from user_agent server-side: modern browsers
        freeze the UA string and expose the real device, OS and version only
        through the Client Hints API, which never reaches the server. Client
        input, so it is trimmed to 200 characters and stored as sent. Defaults
        to "desktop" when absent or blank.
    browser:
      type: string
      description: >-
        Browser name from the same in-browser detection ("Chrome", "Safari", …).
        Defaults to "Unknown" when absent or blank.
    browser_type:
      type: string
      description: >-
        Qualifier for non-ordinary clients the SDK recognises — crawler, inapp,
        email, fetcher, cli — and empty for a normal browser. Note the server's
        own bot filtering works off the request User-Agent header, not this
        field, which is client input like the rest.
    os:
      type: string
      description: >-
        Operating system from the same in-browser detection ("macOS",
        "Windows", "iPadOS", …). Defaults to "Unknown" when absent or blank.
    user_agent:
      type: string
      description: >-
        Raw user agent, stored as sent and usable as an attribution filter
        dimension. It is NOT parsed into device/browser/os — those arrive
        already resolved in the fields above. Falls back to the request's
        User-Agent header when the attribute is absent.
    connection_type: { type: string }
    language: { type: string }
    timezone: { type: string }

WebFilterCondition:
  type: object
  required: [field, operator]
  properties:
    field:
      type: string
    operator:
      type: string
      enum: [equals, not_equals, contains, not_contains, is_empty, is_not_empty, regex]
    value:
      type: string

WebFilterOperation:
  type: object
  required: [dimension, action]
  properties:
    dimension:
      type: string
    action:
      type: string
      enum: [set_value, unset_value, set_default_value]
    value:
      type: string

WebFilter:
  type: object
  required: [id, name, priority, conditions, operations, enabled]
  properties:
    id: { type: string }
    name: { type: string }
    priority:
      type: integer
      minimum: 0
      maximum: 1000
    order: { type: integer }
    tags:
      type: array
      items: { type: string }
    conditions:
      type: array
      items:
        $ref: '#/WebFilterCondition'
    operations:
      type: array
      items:
        $ref: '#/WebFilterOperation'
    enabled: { type: boolean }
    version: { type: string }

WebAnalyticsSettings:
  type: object
  nullable: true
  properties:
    enabled: { type: boolean }
    allowed_domains:
      type: array
      items: { type: string }
      description: Origins allowed to send beats ("example.com", "*.example.com"); empty allows all.
    bounce_threshold_seconds:
      type: integer
      description: Sessions with less engaged time count as bounces (default 10).
    filters:
      type: array
      items:
        $ref: '#/WebFilter'
    filters_version:
      type: string
      readOnly: true
    custom_dimension_labels:
      type: object
      additionalProperties: { type: string }
    identify_from_email_links:
      type: boolean
      description: >-
        Adds a signed identity to the links of tracked emails, so a recipient
        who clicks one is recognised on landing without any code on the
        customer's site, and their visit is tied to their contact record. Off by
        default: unlike identify(), which the customer's own server calls with
        their own secret, this credential is minted by Notifuse for every
        recipient of every tracked send, so it is theirs to ask for.
    geo_enabled: { type: boolean }
    geo_store_city: { type: boolean }
    geo_store_region: { type: boolean }
    geo_coordinates_precision:
      type: integer
      minimum: 0
      maximum: 2

WebAnalyticsBackfillRequest:
  type: object
  required: [workspace_id]
  properties:
    workspace_id:
      type: string

WebAnalyticsBackfillResponse:
  type: object
  properties:
    backfill:
      type: object
      nullable: true
      properties:
        task_id: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed, paused]
        progress:
          type: number
        state:
          type: object
          properties:
            filters_version: { type: string }
            partition_index: { type: integer }
            rows_updated:
              type: integer
              format: int64
        error_message: { type: string }
