Template:
  type: object
  properties:
    id:
      type: string
      description: Unique identifier for the template (alphanumeric, underscores, and hyphens only)
      example: welcome_email
      maxLength: 32
      pattern: ^[a-zA-Z0-9_-]+$
    name:
      type: string
      description: Name of the template
      example: Welcome Email
      maxLength: 255
    version:
      type: integer
      format: int64
      description: Version number of the template
      example: 1
    channel:
      type: string
      enum:
        - email
        - web
      description: Communication channel
      example: email
    email:
      $ref: '#/EmailTemplate'
    web:
      $ref: '#/WebTemplate'
    category:
      type: string
      enum:
        - marketing
        - transactional
        - welcome
        - opt_in
        - unsubscribe
        - bounce
        - blocklist
        - blog
        - other
      description: Template category
      example: transactional
      maxLength: 20
    template_macro_id:
      type: string
      nullable: true
      description: ID of the template macro (layout) to use
    integration_id:
      type: string
      nullable: true
      readOnly: true
      description: >-
        ID of the integration managing this template (e.g., Supabase). Server-owned: it is set
        when the integration creates the template and cannot be set or changed through the API.
    test_data:
      type: object
      additionalProperties: true
      description: Test data for template preview
      example:
        user_name: John Doe
        action_url: https://example.com/action
    settings:
      type: object
      additionalProperties: true
      description: Channel-specific third-party settings
    translations:
      type: object
      additionalProperties:
        $ref: '#/TemplateTranslation'
      description: Per-language content variants, keyed by language code
      example:
        fr:
          email:
            subject: Bienvenue
    created_at:
      type: string
      format: date-time
      description: When the template was created
    updated_at:
      type: string
      format: date-time
      description: When the template was last updated
    deleted_at:
      type: string
      format: date-time
      nullable: true
      description: >-
        When the template was deleted, null while it is active. Deleted templates no longer
        appear in `templates.list`, but `templates.get` still returns them, because messages
        already sent are rendered from them.
  required:
    - id
    - name
    - channel
    - category

EmailTemplate:
  type: object
  properties:
    editor_mode:
      type: string
      enum:
        - visual
        - code
      default: visual
      description: >-
        Which editor the email is written in. `visual` stores the drag-and-drop block tree in
        `visual_editor_tree`; `code` stores raw MJML in `mjml_source`. The mode is set when the
        template is created and cannot be changed afterwards: an update in the other mode is
        refused with a 400. To switch, create a new template in the other mode.
    mjml_source:
      type: string
      description: >-
        Raw MJML source (supports Liquid templating). Required when `editor_mode` is `code`,
        ignored otherwise.
      example: <mjml><mj-body><mj-section><mj-column><mj-text>Hello {{ contact.first_name }}</mj-text></mj-column></mj-section></mj-body></mjml>
    sender_id:
      type: string
      description: ID of the sender configuration to use
      example: sender_123
    reply_to:
      type: string
      format: email
      description: Reply-To email address
      example: support@example.com
    subject:
      type: string
      description: Email subject line (supports Liquid templating)
      example: Welcome, {{user_name}}!
    subject_preview:
      type: string
      nullable: true
      description: Preview text shown in email clients
      example: Get started with your account
    compiled_preview:
      type: string
      description: Compiled HTML preview of the email
    visual_editor_tree:
      type: object
      description: >-
        MJML visual editor tree structure. Required when `editor_mode` is `visual` (the
        default), ignored in `code` mode. A block under `mj-body` of type `mj-wrapper`,
        `mj-section`, `mj-text`, `mj-image`, `mj-button`, `mj-divider`, `mj-spacer`,
        `mj-social` or `mj-raw` can carry a `display_condition` (see `DisplayCondition`):
        the block is then sent only to recipients for whom it holds. A condition anywhere
        else, on a block that holds an `mj-liquid`, or an invalid one, is refused with a 400.
      example:
        type: mjml
        children: []
    text:
      type: string
      nullable: true
      maxLength: 65536
      description: >-
        Custom plain-text version of the email, sent next to the HTML. Liquid is
        rendered with the same data as the body (write `{% raw %}` around a literal
        `{{`). Its links are sent as written: neither tracked nor given UTM
        parameters. Omit it, or send only whitespace, for the automatic version
        generated from the HTML at every send. Each translation has its own; a
        translation without one gets the automatic version of its own HTML. Saving
        a text with a Liquid syntax error, an `include` or `render` tag, or over
        64 KiB answers 400. If it cannot be rendered at send time, the email gets
        the automatic version.
      example: "Hi {{ contact.first_name }},\n\nYour order has shipped.\n"
  required:
    - subject
    - compiled_preview

WebTemplate:
  type: object
  properties:
    content:
      type: object
      additionalProperties: true
      description: Tiptap JSON content (source of truth for web templates)
    html:
      type: string
      description: Pre-rendered HTML for display
    plain_text:
      type: string
      description: Extracted text for search indexing
  required:
    - content

TemplateTranslation:
  type: object
  description: >-
    Content for one language. Carries the field matching the template's channel: email for an
    email template, web for a web template.
  properties:
    email:
      $ref: '#/EmailTemplate'
    web:
      $ref: '#/WebTemplate'

CreateTemplateRequest:
  type: object
  required:
    - workspace_id
    - id
    - name
    - channel
    - category
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace
      example: ws_1234567890
    id:
      type: string
      description: Unique identifier for the template (alphanumeric, underscores, and hyphens only)
      example: welcome_email
      maxLength: 32
      pattern: ^[a-zA-Z0-9_-]+$
    name:
      type: string
      description: Name of the template
      example: Welcome Email
      maxLength: 255
    channel:
      type: string
      enum:
        - email
        - web
      description: Communication channel
      example: email
    email:
      $ref: '#/EmailTemplate'
    web:
      $ref: '#/WebTemplate'
    category:
      type: string
      enum:
        - marketing
        - transactional
        - welcome
        - opt_in
        - unsubscribe
        - bounce
        - blocklist
        - blog
        - other
      description: Template category
      example: transactional
    template_macro_id:
      type: string
      nullable: true
      description: ID of the template macro (layout) to use
    test_data:
      type: object
      additionalProperties: true
      description: Test data for template preview
    settings:
      type: object
      additionalProperties: true
      description: Channel-specific settings
    translations:
      type: object
      additionalProperties:
        $ref: '#/TemplateTranslation'
      description: >-
        Per-language content variants, keyed by language code. Every key must be one of the
        workspace's configured languages.

UpdateTemplateRequest:
  type: object
  description: >-
    Replaces the template's content, creating a new version. Fields the body omits are not
    cleared: translations are carried over from the stored template, and integration_id is
    server-owned and always preserved.
  required:
    - workspace_id
    - id
    - name
    - channel
    - category
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace
      example: ws_1234567890
    id:
      type: string
      description: ID of the template to update
      example: welcome_email
      maxLength: 32
    name:
      type: string
      description: Name of the template
      example: Welcome Email
      maxLength: 255
    channel:
      type: string
      enum:
        - email
        - web
      description: Communication channel
      example: email
    email:
      $ref: '#/EmailTemplate'
    web:
      $ref: '#/WebTemplate'
    category:
      type: string
      enum:
        - marketing
        - transactional
        - welcome
        - opt_in
        - unsubscribe
        - bounce
        - blocklist
        - blog
        - other
      description: Template category
      example: transactional
    template_macro_id:
      type: string
      nullable: true
      description: ID of the template macro (layout) to use
    test_data:
      type: object
      additionalProperties: true
      description: Test data for template preview
    settings:
      type: object
      additionalProperties: true
      description: Channel-specific settings
    translations:
      type: object
      additionalProperties:
        $ref: '#/TemplateTranslation'
      description: >-
        Per-language content variants, keyed by language code. Every key must be one of the
        workspace's configured languages. Omit the property to keep the stored translations
        untouched; send an empty object to delete all of them.

DeleteTemplateRequest:
  type: object
  required:
    - workspace_id
    - id
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace
      example: ws_1234567890
    id:
      type: string
      description: ID of the template to delete
      example: welcome_email

CompileTemplateRequest:
  type: object
  description: Provide `visual_editor_tree` for a visual-mode template, or `mjml_source` for a code-mode one.
  required:
    - workspace_id
    - message_id
  properties:
    workspace_id:
      type: string
      description: The ID of the workspace
      example: ws_1234567890
    message_id:
      type: string
      description: Unique message ID for tracking
      example: msg_abc123
    visual_editor_tree:
      type: object
      description: MJML visual editor tree structure (must have type 'mjml')
      additionalProperties: true
    mjml_source:
      type: string
      description: >-
        Raw MJML source of a code-mode template. When set, it is compiled instead of
        `visual_editor_tree`.
    subject:
      type: string
      description: |
        Optional email subject. When provided, it is rendered through the same
        Liquid engine the send path uses (with `test_data`) and the rendered
        result is returned as `subject` in the response. Liquid processing is
        skipped when `preserve_liquid` is true, `channel` is `web`, or
        `test_data` is empty.
      example: "Hi {{ contact.first_name }}"
    subject_preview:
      type: string
      description: |
        Optional inbox preview text (the snippet shown after the subject in
        most clients). Rendered through Liquid like `subject` and returned as
        `subject_preview` in the response.
      example: "Welcome {{ contact.first_name }}"
    text:
      type: string
      description: |
        Optional source of a custom plain-text version, as stored in a
        template's `email.text`. It is rendered with `test_data` (kept as
        written when `preserve_liquid` is true) and returned as `text` with
        `text_source` set to `custom`. Omit it to get the automatic version.
      example: "Hi {{ contact.first_name }}"
    test_data:
      type: object
      description: Data to use for Liquid templating
      additionalProperties: true
      example:
        user_name: John Doe
        action_url: https://example.com/action
    tracking_settings:
      $ref: '#/TrackingSettings'
    channel:
      type: string
      enum:
        - email
        - web
      description: >-
        Which channel this template targets. It selects the content object the
        template must carry: an `email` template supplies `email` and omits
        `web`, and a `web` template does the reverse.

CompileTemplateResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Whether compilation was successful
    mjml:
      type: string
      description: Generated MJML markup
    html:
      type: string
      description: Compiled HTML output
    subject:
      type: string
      description: |
        Rendered email subject. Present only when the request included a
        non-empty `subject`. Returned on both success and error paths so the
        caller can display the rendered subject alongside any compilation
        error.
      example: "Hi Pierre"
    subject_preview:
      type: string
      description: |
        Rendered inbox preview text. Present only when the request included a
        non-empty `subject_preview`. Returned on both success and error paths.
      example: "Welcome Pierre"
    text:
      type: string
      description: |
        Plain-text version sent with the email: the custom text rendered when
        the request has a `text` that renders, otherwise the automatic version,
        generated from the compiled HTML with the same links. Present only when
        an email compilation succeeds. An empty string means the email holds no
        text to read and is sent as HTML only.
      example: "Hi Pierre\n\nShop now (https://example.com/shop)\n"
    text_source:
      type: string
      enum:
        - auto
        - custom
      description: Where `text` comes from. Present when `text` is.
    text_error:
      type: string
      description: |
        Why the custom `text` of the request could not be used (a Liquid
        error, or a rendered text over 256 KiB); `text` is then the automatic
        version, as a send would be. With `preserve_liquid`, also flags an
        automatic text whose Liquid tags would not parse.
    error:
      type: object
      description: MJML compilation error details, if any
      properties:
        message:
          type: string

TrackingSettings:
  type: object
  properties:
    enable_tracking:
      type: boolean
      description: Whether to enable click/open tracking
    tracking_mode:
      type: string
      enum: [inherit, no_tracking, disabled]
      description: |
        Per-notification tracking preference. Absent or "inherit" follows the
        workspace tracking settings and each recipient's tracking consent (the
        workspace settings always act as a kill-switch and cannot be
        overridden). "no_tracking" leaves out the open pixel and the
        click-tracking redirect but keeps the UTM parameters. "disabled" suppresses all
        rewriting for this notification — no click-tracking redirect, no open
        pixel, and no UTM parameters — used for auth emails (e.g. Supabase
        magic links) whose single-use URLs must never be modified. Update
        semantics: an ABSENT tracking_mode field keeps the stored value (so
        partial edits cannot wipe an opt-out; an empty string is treated as
        absent); an explicit "inherit" resets the notification to follow the
        workspace flag; an explicit "disabled" opts it out. Note that the
        other tracking_settings fields (utm_*) are replaced wholesale on
        update — only tracking_mode has keep-when-absent semantics.
    endpoint:
      type: string
      description: API endpoint for tracking redirects
    utm_source:
      type: string
      description: UTM source parameter
    utm_medium:
      type: string
      description: UTM medium parameter
    utm_campaign:
      type: string
      description: UTM campaign parameter
    utm_content:
      type: string
      description: UTM content parameter
    utm_term:
      type: string
      description: UTM term parameter
    workspace_id:
      type: string
      description: Workspace ID for tracking
    message_id:
      type: string
      description: Message ID for tracking

DisplayCondition:
  type: object
  description: >-
    Shows a block of a visual template only when a condition on the template data holds.
    Evaluated at send time with the same data as the Liquid of the template; the MJML export
    writes it as Liquid around the block.
  required:
    - match
    - rules
  properties:
    match:
      type: string
      enum:
        - all
        - any
      description: '`all`: every rule holds. `any`: at least one rule holds.'
    rules:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: '#/DisplayConditionRule'
  example:
    match: all
    rules:
      - variable: order.has_image
        operator: is_true
      - variable: contact.custom_string_1
        operator: eq
        value: vip

DisplayConditionRule:
  type: object
  required:
    - variable
    - operator
  properties:
    variable:
      type: string
      maxLength: 200
      description: >-
        Path of a template variable, without braces: segments of letters, digits and
        underscores separated by dots, the first one not starting with a digit, such as
        `contact.first_name` or `order.items.size`. The `empty` and `to_liquid` segments
        are refused: test an empty list or text with `is_blank`.
      example: order.total
    operator:
      type: string
      enum:
        - is_true
        - is_blank
        - is_present
        - is_absent
        - eq
        - neq
        - contains
        - not_contains
        - gt
        - gte
        - lt
        - lte
      description: >-
        `is_true`, `is_blank` (false, empty or absent), `is_present` and `is_absent` take no
        value. `eq`, `neq`, `contains` and `not_contains` compare text (`contains` on a list
        looks for an element equal to the value). `gt`, `gte`, `lt` and `lte` compare
        numbers; a variable that is not a number makes the rule false.
    value:
      type: string
      maxLength: 200
      description: >-
        Required by the operators that compare. Free text, without the Liquid delimiters
        `{{`, `}}`, `{%` and `%}`; for `gt`, `gte`, `lt` and `lte`, a number of at most 15
        digits before the decimal point.
      example: '100'
