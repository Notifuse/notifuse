Automation:
  type: object
  description: An automation, its trigger and the steps of its graph.
  properties:
    id:
      type: string
      example: welcome-series
    workspace_id:
      type: string
      example: ws_1234567890
    name:
      type: string
      example: Welcome Series
    status:
      type: string
      enum: [draft, live, paused]
      example: live
    list_id:
      type: string
      description: The list the automation sends to; empty when it has none.
      example: newsletter
    exit_on_reply:
      type: boolean
      description: Whether a reply from the contact ends their journey.
    trigger:
      $ref: '#/AutomationTrigger'
    trigger_sql:
      type: string
      description: The condition generated from the trigger.
    root_node_id:
      type: string
      description: The first step of the graph, its trigger.
      example: ws-trigger
    nodes:
      type: array
      items:
        $ref: '#/AutomationNode'
    stats:
      $ref: '#/AutomationStats'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AutomationTrigger:
  type: object
  description: The contact timeline event that starts a journey.
  properties:
    event_kind:
      type: string
      description: The timeline event kind, such as list.subscribed, custom_event or email.link_clicked.
      example: list.subscribed
    list_id:
      type: string
      description: For list events.
    segment_id:
      type: string
      description: For segment events.
    custom_event_name:
      type: string
      description: For custom_event.
    updated_fields:
      type: array
      items:
        type: string
      description: For contact.updated, the fields whose change starts a journey.
    link_url:
      type: string
      description: For email.link_clicked, text the clicked URL contains.
    broadcast_id:
      type: string
      description: For email.link_clicked, the broadcast that sent the email.
    template_id:
      type: string
      description: For email.link_clicked, the template the email was sent with.
    conditions:
      type: object
      nullable: true
      description: Conditions on the contact, in the segment condition format.
    frequency:
      type: string
      enum: [once, every_time]

AutomationNode:
  type: object
  description: A step of the automation.
  properties:
    id:
      type: string
      example: ws-email-welcome
    automation_id:
      type: string
    type:
      type: string
      enum: [trigger, delay, email, branch, filter, add_to_list, remove_from_list, ab_test, webhook, list_status_branch]
    config:
      type: object
      additionalProperties: true
      description: The step's settings, which depend on its type.
    next_node_id:
      type: string
      description: The next step, for steps that do not split.
    position:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    created_at:
      type: string
      format: date-time

AutomationStats:
  type: object
  description: The automation's journey counters.
  properties:
    enrolled:
      type: integer
      format: int64
    completed:
      type: integer
      format: int64
    exited:
      type: integer
      format: int64
    failed:
      type: integer
      format: int64

JourneyCounts:
  type: object
  description: The journeys of an automation by status.
  properties:
    active:
      type: integer
    completed:
      type: integer
    exited:
      type: integer
    failed:
      type: integer
    total:
      type: integer
      description: Every journey, any other status included.

ListAutomationsResponse:
  type: object
  properties:
    automations:
      type: array
      items:
        $ref: '#/Automation'
    total:
      type: integer
      description: The automations matching the filters, without limit and offset.
    journey_counts:
      type: object
      description: >-
        With with_journey_counts=true only: the journey counts of each
        returned automation, keyed by automation ID. An empty object when no
        automation is returned.
      additionalProperties:
        $ref: '#/JourneyCounts'
      example:
        welcome-series:
          active: 12
          completed: 840
          exited: 31
          failed: 4
          total: 887

NodeEmailStats:
  type: object
  description: The messages an email step sent, from the message history.
  properties:
    executions:
      type: integer
      format: int64
      description: Completed executions of the step that queued a message.
    queued:
      type: integer
      format: int64
      description: Not in the message history yet and still in the sending queue.
    not_sent:
      type: integer
      format: int64
      description: Neither in the message history nor in the sending queue.
    sent:
      type: integer
      format: int64
    delivered:
      type: integer
      format: int64
    opened:
      type: integer
      format: int64
    opens_tracked:
      type: integer
      format: int64
      description: Sent emails whose opens are tracked, the base of an open rate.
    clicked:
      type: integer
      format: int64
    clicks_tracked:
      type: integer
      format: int64
      description: Sent emails whose clicks are tracked, the base of a click rate.
    failed:
      type: integer
      format: int64
    bounced:
      type: integer
      format: int64
    complained:
      type: integer
      format: int64
    unsubscribed:
      type: integer
      format: int64

NodeStats:
  type: object
  description: What the journeys did at one step.
  properties:
    node_type:
      type: string
      description: The step's type in the current graph.
      example: email
    visits:
      type: integer
      format: int64
      description: Distinct journeys that reached the step; a retry is the same visit.
    completed:
      type: integer
      format: int64
      description: Executions that completed without an error.
    failed_attempts:
      type: integer
      format: int64
      description: Attempts that failed, each retry counted.
    skipped:
      type: integer
      format: int64
      description: Emails not sent because the contact was not subscribed.
    skip_reasons:
      type: object
      additionalProperties:
        type: integer
        format: int64
      example:
        unsubscribed: 3
    errors:
      type: integer
      format: int64
      description: Executions that completed with an error in their output.
    failed_journeys:
      type: integer
      format: int64
      description: Journeys that failed on this step.
    in_progress:
      type: integer
      format: int64
      description: Active journeys on this step now.
    waiting:
      type: integer
      format: int64
      description: Active journeys waiting on this delay now.
    retrying:
      type: integer
      format: int64
      description: Active journeys waiting to retry this step now.
    branches:
      type: object
      description: >-
        For splits, the completed executions by path: yes and no for a
        filter, the branch for a list status branch, the variant ID for an A/B
        test, the path ID for a branch.
      additionalProperties:
        type: integer
        format: int64
      example:
        yes: 120
        no: 34
    email:
      $ref: '#/NodeEmailStats'

NodeStatsResponse:
  type: object
  properties:
    automation_id:
      type: string
    since:
      type: string
      format: date-time
      description: The start of the period, in UTC; absent for all time.
    until:
      type: string
      format: date-time
      description: The end of the period, in UTC; absent for all time.
    nodes:
      type: object
      description: The statistics of every step of the graph, keyed by node ID.
      additionalProperties:
        $ref: '#/NodeStats'
