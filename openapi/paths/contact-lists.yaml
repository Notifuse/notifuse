/api/contactLists.updateStatus:
  post:
    summary: Update contact list subscription status
    description: |
      Updates the subscription status of a contact in a specific list. Can set status to active, pending, unsubscribed, bounced, or complained.

      A contact who opted out keeps their opt-out. From `unsubscribed`, the status can only move to `bounced` or `complained`; from `bounced`, only to `complained`; `complained` is final. Other changes return `409` with the stored status.

      To subscribe an `unsubscribed` contact again, send `status: active` with `resubscribe: true`. The audit log records it. An API key can't clear `bounced`; a user signed in to the console can, once the address works again.

      **Note:** This endpoint only modifies **existing** list memberships. It does not add a contact to a list. To add a contact to a list, use the `/subscribe` endpoint (for public lists) or the `/api/contacts.import` endpoint (for any list, requires authentication).
    operationId: updateContactListStatus
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/contact.yaml#/UpdateContactListStatusRequest'
    responses:
      '200':
        description: Status updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/contact.yaml#/UpdateContactListStatusResponse'
      '400':
        description: Bad request - validation failed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingWorkspaceId:
                value:
                  error: workspace_id is required
              missingEmail:
                value:
                  error: email is required
              missingListId:
                value:
                  error: list_id is required
              invalidStatus:
                value:
                  error: invalid status value
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '404':
        description: Contact list relationship not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: contact list not found
      '409':
        description: The contact opted out of the list and the change would undo it
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: What was refused and what would be allowed
                status:
                  type: string
                  enum:
                    - unsubscribed
                    - bounced
                    - complained
                  description: The status the contact keeps
            example:
              error: 'the contact unsubscribed from this list: set resubscribe to true to subscribe them again'
              status: unsubscribed
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
