/api/annotations.list:
  get:
    summary: List annotations
    description: >
      Returns the workspace's annotations, most recent moment first. Every
      filter is optional; with none the most recent 100 rows come back.


      Gated by the web_analytics read permission, like the rest of the web
      analytics surface.
    operationId: listAnnotations
    tags: [Web Analytics]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: start
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: >-
          Only annotations at or after this instant. Must be RFC3339; a
          malformed value is a 400 rather than a dropped filter.
        example: '2026-08-01T00:00:00Z'
      - name: end
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Only annotations at or before this instant. Must be RFC3339.
        example: '2026-08-31T23:59:59Z'
      - name: sources
        in: query
        required: false
        schema:
          type: string
        description: >-
          Comma-separated list of sources to keep. Any value outside
          `manual`/`broadcast` is a 400.
        example: manual,broadcast
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
        description: >-
          Maximum rows to return. Values above the maximum are clamped to it
          rather than refused.
        example: 100
    responses:
      '200':
        description: Annotations matching the filters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/annotations.yaml#/ListAnnotationsResponse'
      '400':
        description: Bad request - invalid query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingWorkspaceId:
                value:
                  error: workspace_id is required
              malformedStart:
                value:
                  error: start must be an RFC3339 timestamp
              endBeforeStart:
                value:
                  error: 'invalid request: end must not be before start'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing required permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Insufficient permissions: read access to web analytics required'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to list annotations

/api/annotations.get:
  get:
    summary: Get an annotation
    description: Retrieves a single annotation by ID. Requires the web_analytics read permission.
    operationId: getAnnotation
    tags: [Web Analytics]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the annotation
        example: 3f2504e04f8911d39a0c0305e82c3301
    responses:
      '200':
        description: The annotation
        content:
          application/json:
            schema:
              $ref: '../components/schemas/annotations.yaml#/AnnotationResponse'
      '400':
        description: Bad request - missing query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: id is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing required permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Insufficient permissions: read access to web analytics required'
      '404':
        description: No annotation with that ID in this workspace
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'annotation not found with ID: 3f2504e04f8911d39a0c0305e82c3301'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to get annotation

/api/annotations.create:
  post:
    summary: Create an annotation
    description: >
      Creates a manual annotation. Requires the web_analytics write permission.


      `source` is always stored as `manual` and `source_id` is always empty:
      only the platform writes automatic rows, so there is no way to attach a
      caller-supplied key to one. **This endpoint is therefore not idempotent** —
      a retried call (a CI job re-running a deploy marker, for instance) writes
      a second annotation. De-duplicate on the caller's side, or delete the
      extra row.


      Omitted `color` and `timezone` are filled in server-side: the default
      colour, and the workspace timezone falling back to UTC.
    operationId: createAnnotation
    tags: [Web Analytics]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/annotations.yaml#/CreateAnnotationRequest'
    responses:
      '201':
        description: Annotation created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/annotations.yaml#/AnnotationResponse'
      '400':
        description: >-
          Bad request - unparseable body, validation failed, or the instance
          runs in demo mode, where every mutating endpoint is closed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              invalidBody:
                value:
                  error: Invalid request body
              missingTitle:
                value:
                  error: 'invalid request: title is required'
              invalidColor:
                value:
                  error: 'invalid request: color must be a hex color like #3b82f6'
              systemSource:
                value:
                  error: 'invalid request: source must be "manual"'
              demoMode:
                value:
                  error: This operation is not allowed in demo mode
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing required permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Insufficient permissions: write access to web analytics required'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to create annotation

/api/annotations.update:
  post:
    summary: Update an annotation
    description: >
      Edits an annotation's moment, timezone and presentation. Requires the
      web_analytics write permission.


      Automatic annotations are editable — an operator may want to reword a
      broadcast's title — but their origin is not: `source` and `source_id` are
      reloaded from storage and carried forward, so an edit can neither promote
      a manual row to a system one nor take over another broadcast's slot.
    operationId: updateAnnotation
    tags: [Web Analytics]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/annotations.yaml#/UpdateAnnotationRequest'
    responses:
      '200':
        description: Annotation updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/annotations.yaml#/AnnotationResponse'
      '400':
        description: >-
          Bad request - unparseable body, validation failed, or the instance
          runs in demo mode.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingId:
                value:
                  error: 'invalid request: id is required'
              missingAnnotatedAt:
                value:
                  error: 'invalid request: annotated_at is required'
              demoMode:
                value:
                  error: This operation is not allowed in demo mode
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing required permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Insufficient permissions: write access to web analytics required'
      '404':
        description: No annotation with that ID in this workspace
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'annotation not found with ID: 3f2504e04f8911d39a0c0305e82c3301'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to update annotation

/api/annotations.delete:
  post:
    summary: Delete an annotation
    description: >
      Deletes an annotation, automatic ones included — a broadcast annotation
      cannot come back by accident, since its broadcast has already started.
      Requires the web_analytics write permission.
    operationId: deleteAnnotation
    tags: [Web Analytics]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/annotations.yaml#/DeleteAnnotationRequest'
    responses:
      '200':
        description: >-
          Annotation deleted. A body rather than a 204, so a delete is never
          indistinguishable from a proxy swallowing the response.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/annotations.yaml#/DeleteAnnotationResponse'
      '400':
        description: >-
          Bad request - unparseable body, missing id, or the instance runs in
          demo mode.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingId:
                value:
                  error: 'invalid request: id is required'
              demoMode:
                value:
                  error: This operation is not allowed in demo mode
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing required permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Insufficient permissions: write access to web analytics required'
      '404':
        description: No annotation with that ID in this workspace
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'annotation not found with ID: 3f2504e04f8911d39a0c0305e82c3301'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to delete annotation
