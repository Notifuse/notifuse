/subscribe:
  post:
    summary: Subscribe to email lists
    description: |
      Subscribe a contact to one or more email lists. This is a public endpoint that doesn't require authentication.

      **Important:** This endpoint subscribes contacts to **public lists** only. To add a contact to a private list, use the authenticated `/api/lists.subscribe` endpoint with a bearer token. A valid `email_hmac` in the contact object only lets the contact confirm a pending double opt-in on a private list: it never adds them to one, nor back to one they left.

      If the list has double opt-in enabled, a confirmation email will be sent.

      A contact who unsubscribed from a list stays unsubscribed after a request without `email_hmac`: when the list has a double opt-in template, they get the confirmation email, and its link subscribes them again. A request with a valid `email_hmac` subscribes them again at once. This endpoint ignores `resubscribe`.
    operationId: subscribeToLists
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/contact.yaml#/SubscribeToListsRequest'
    responses:
      '200':
        description: Subscription successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  description: Whether the subscription was successful
                  example: true
      '400':
        description: Bad request - validation failed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingWorkspaceId:
                value:
                  error: workspace_id is required
              invalidEmail:
                value:
                  error: 'invalid contact: invalid email format'
              missingListIds:
                value:
                  error: list_ids is required
              listNotPublic:
                value:
                  error: list is not public
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to subscribe to lists

/api/lists.subscribe:
  post:
    summary: Subscribe to email lists (authenticated)
    description: |
      Subscribe a contact to one or more email lists. This is an authenticated endpoint that requires a bearer token.

      Unlike the public `/subscribe` endpoint, this endpoint can subscribe contacts to **any list** (public or private) as long as the authenticated user has write permission on lists.

      **Note:** Authenticated requests skip double opt-in, since you may have collected consent outside Notifuse: a new or `pending` subscription is set to `active` whatever the list's setting.

      A contact who unsubscribed from a list stays `unsubscribed`. No email is sent, and `contact_lists` in the response reports that status. Send `resubscribe: true` to subscribe them again: they become `active` with no confirmation email, and the audit log records it. Do this only when the contact asked for it. Bounced and complained contacts are never changed.
    operationId: subscribeToListsAuthenticated
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/contact.yaml#/SubscribeToListsRequest'
    responses:
      '200':
        description: Subscription successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  description: Whether the subscription was successful
                  example: true
                contact_lists:
                  type: array
                  description: One entry per requested list, with the status the contact ended up in. A contact who unsubscribed and was not re-subscribed is reported as `unsubscribed`.
                  items:
                    $ref: '../components/schemas/contact.yaml#/ContactList'
      '400':
        description: Bad request - validation failed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingWorkspaceId:
                value:
                  error: workspace_id is required
              invalidEmail:
                value:
                  error: 'invalid contact: invalid email format'
              missingListIds:
                value:
                  error: list_ids is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to subscribe to lists
