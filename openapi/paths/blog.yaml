        example: 0
    responses:
      '200':
        description: One page of theme versions
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/ListBlogThemesResponse'
      '400':
        description: Bad request - invalid query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: limit must be a valid integer
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/api/blogThemes.get:
  get:
    summary: Get a blog theme version
    description: Retrieves one theme version with its files. Requires the blog read permission.
    operationId: getBlogTheme
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: version
        in: query
        required: true
        schema:
          type: integer
        description: The theme version
        example: 4
    responses:
      '200':
        description: The theme version
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogThemeResponse'
      '400':
        description: Bad request - missing or non-integer version
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: version parameter is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '404':
        description: No theme with this version
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/api/blogThemes.getPublished:
  get:
    summary: Get the published blog theme
    description: >-
      Retrieves the theme version currently live on the blog. Requires the
      blog read permission.
    operationId: getPublishedBlogTheme
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
    responses:
      '200':
        description: The published theme
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogThemeResponse'
      '400':
        description: Bad request - missing workspace_id
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
