/api/blogCategories.list:
  get:
    summary: List blog categories
    description: >-
      Returns every category of the workspace's blog, newest first. Not
      paginated. Requires the blog read permission.
    operationId: listBlogCategories
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
    responses:
      '200':
        description: The workspace's categories
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/ListBlogCategoriesResponse'
      '400':
        description: Bad request - missing workspace_id
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: workspace_id is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to list categories

/api/blogCategories.get:
  get:
    summary: Get a blog category
    description: >-
      Retrieves a category by `id` or by `slug`; when both are given, `id`
      wins. Requires the blog read permission.
    operationId: getBlogCategory
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: The category ID. Either `id` or `slug` is required.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: The category slug. Either `id` or `slug` is required.
        example: product
    responses:
      '200':
        description: The category
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogCategoryResponse'
      '400':
        description: Bad request - missing query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: either id or slug is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '500':
        description: >-
          Internal server error. Also returned when no category matches the id
          or slug.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to get category

/api/blogCategories.create:
  post:
    summary: Create a blog category
    description: >-
      Creates a category. Posts always belong to one, so a blog needs at least
      one category before its first post. Requires the blog write permission.
    operationId: createBlogCategory
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/CreateBlogCategoryRequest'
    responses:
      '201':
        description: Category created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogCategoryResponse'
      '400':
        description: Bad request - validation failed or the slug is taken
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              slugTaken:
                value:
                  error: category with slug 'product' already exists
              invalidSlug:
                value:
                  error: slug must contain only lowercase letters, numbers, and hyphens
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogCategories.update:
  post:
    summary: Update a blog category
    description: >-
      Replaces a category's name, slug, description and SEO settings. This is
      not a patch: optional fields left out are cleared. Public pages are
      cached for up to 5 minutes, so a rename can take that long to show on
      the blog. Requires the blog write permission.
    operationId: updateBlogCategory
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/UpdateBlogCategoryRequest'
    responses:
      '200':
        description: Category updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogCategoryResponse'
      '400':
        description: Bad request - validation failed, slug taken or category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'category not found: blog category not found'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogCategories.delete:
  post:
    summary: Delete a blog category
    description: >-
      Deletes a category **and every post in it**, in one transaction. Both
      are soft-deleted, which frees their slugs for reuse. Public pages are
      cached for up to 5 minutes, so the category can take that long to
      disappear from the blog. Requires the blog write permission.
    operationId: deleteBlogCategory
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id:
                type: string
                example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    responses:
      '200':
        description: Category and its posts deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
      '400':
        description: Bad request - missing id or category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'failed to delete category: blog category not found'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogPosts.list:
  get:
    summary: List blog posts
    description: >-
      Returns posts page by page, drafts included unless filtered out. Posts
      come newest-created first; with `status=published`, most recently
      published first. Page through with `page` and `limit` until you have
      `total_count` posts. Requires the blog read permission.
    operationId: listBlogPosts
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: category_id
        in: query
        required: false
        schema:
          type: string
        description: Only posts in this category.
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [all, draft, published]
          default: all
        description: >-
          `draft` is posts never published or since unpublished; `published`
          is every post with a publication date, including one dated in the
          future.
        example: published
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-indexed page number.
        example: 2
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 100
        description: >-
          Posts per page. Values above the maximum are clamped to it rather
          than refused.
        example: 50
    responses:
      '200':
        description: One page of posts
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/ListBlogPostsResponse'
      '400':
        description: Bad request - invalid query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              missingWorkspaceId:
                value:
                  error: workspace_id is required
              invalidPage:
                value:
                  error: page must be a valid integer
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '500':
        description: Internal server error. Also returned for a `status` outside the enum.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to list posts

/api/blogPosts.get:
  get:
    summary: Get a blog post
    description: >-
      Retrieves a post by `id` or by `slug`; when both are given, `id` wins.
      Drafts are returned too. Requires the blog read permission.
    operationId: getBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace
        example: ws_1234567890
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: The post ID. Either `id` or `slug` is required.
        example: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
      - name: slug
        in: query
        required: false
        schema:
          type: string
        description: >-
          The post slug. Either `id` or `slug` is required. Post slugs are
          unique across the workspace, so the slug alone identifies the post.
        example: october-release
      - name: category_slug
        in: query
        required: false
        schema:
          type: string
        description: >-
          With `slug`, only match the post if it is in this category — the
          lookup a `/{category_slug}/{post_slug}` URL maps to.
        example: product
    responses:
      '200':
        description: The post
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogPostResponse'
      '400':
        description: Bad request - missing query parameters
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: either id or slug is required
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '500':
        description: Internal server error. Also returned when no post matches.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Failed to get post

/api/blogPosts.create:
  post:
    summary: Create a blog post
    description: |
      Creates a post as a draft. The post holds the metadata; its body lives in a web template, so publishing a post over the API takes three calls:

      1. `templates.create` with `channel: "web"`, `category: "blog"` and a `web` object. `web.html` is the body readers see, rendered as-is. `web.content` is required and is the Tiptap document the console editor opens; if you only have HTML, send `{"type": "doc", "content": []}`, and do not edit that post in the console afterwards, because saving there regenerates `web.html` from `web.content`.
      2. `blogPosts.create` with that template's `id` as `template_id`.
      3. `blogPosts.publish`.

      Requires the blog write permission, plus the templates write permission for step 1.
    operationId: createBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/CreateBlogPostRequest'
    responses:
      '201':
        description: Post created as a draft
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogPostResponse'
      '400':
        description: Bad request - validation failed, slug taken or category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            examples:
              slugTaken:
                value:
                  error: post with slug 'october-release' already exists
              unknownCategory:
                value:
                  error: 'category not found: blog category not found'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogPosts.update:
  post:
    summary: Update a blog post
    description: |
      Replaces a post's metadata. This is not a patch: optional fields left out are cleared, so send the post back with your changes applied.

      To change the body, update the template with `templates.update`, which saves a new template version. A post pinned to a `template_version` keeps rendering the old one until you update the post with the new version; a post at version `0` follows the latest version on its own, within the 5-minute page cache.

      Requires the blog write permission.
    operationId: updateBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/UpdateBlogPostRequest'
    responses:
      '200':
        description: Post updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogPostResponse'
      '400':
        description: Bad request - validation failed, slug taken, or post or category not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'post not found: blog post not found'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogPosts.delete:
  post:
    summary: Delete a blog post
    description: >-
      Soft-deletes a post, which takes it off the blog and frees its slug. Its
      template is left in place. Requires the blog write permission.
    operationId: deleteBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/BlogPostIdRequest'
    responses:
      '200':
        description: Post deleted
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
      '400':
        description: Bad request - missing id or post not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'post not found: blog post not found'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogPosts.publish:
  post:
    summary: Publish a blog post
    description: >-
      Publishes a draft: it appears on the blog's home and category pages, at
      its own URL, and in the RSS and JSON feeds. Publishing a post that is
      already published is refused; unpublish it first to change its date.
      Requires the blog write permission.
    operationId: publishBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/PublishBlogPostRequest'
    responses:
      '200':
        description: Post published
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
      '400':
        description: Bad request - missing id, post not found or already published
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'failed to publish post: blog post not found or already published'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogPosts.unpublish:
  post:
    summary: Unpublish a blog post
    description: >-
      Turns a published post back into a draft and clears its publication
      date. Requires the blog write permission.
    operationId: unpublishBlogPost
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/BlogPostIdRequest'
    responses:
      '200':
        description: Post unpublished
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
      '400':
        description: Bad request - missing id, post not found or not published
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: 'failed to unpublish post: blog post not found or not published'
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogThemes.list:
