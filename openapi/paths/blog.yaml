      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog read permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: read access to blog required'
              resource: blog
              permission: read
      '404':
        description: No theme is published
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/api/blogThemes.create:
  post:
    summary: Create a blog theme version
    description: >-
      Saves a new, unpublished theme version, numbered one above the highest
      existing version. Files left out are stored empty. Nothing changes on
      the blog until the version is published. Requires the blog write
      permission.
    operationId: createBlogTheme
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/CreateBlogThemeRequest'
    responses:
      '201':
        description: Theme version created
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogThemeResponse'
      '400':
        description: Bad request - malformed body
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: Invalid request body
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

/api/blogThemes.update:
  post:
    summary: Update a blog theme version
    description: >-
      Edits an unpublished theme version in place. Only the files named in
      `files` are replaced. The published version cannot be edited: create a
      new version, or edit an older one, and publish that instead. Requires the
      blog write permission.
    operationId: updateBlogTheme
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/UpdateBlogThemeRequest'
    responses:
      '200':
        description: Theme version updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/blog.yaml#/BlogThemeResponse'
      '400':
        description: Bad request - version missing, not found or published
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: cannot update published theme
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write

/api/blogThemes.publish:
  post:
    summary: Publish a blog theme version
    description: >-
      Makes a theme version the one the blog renders, and unpublishes the
      previous one in the same transaction. Any version can be published,
      so rolling back is publishing an older one. Requires the blog write
      permission.
    operationId: publishBlogTheme
    tags: [Blog]
    security:
      - BearerAuth: []
    parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the workspace. Passed in the query string, not the body.
        example: ws_1234567890
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/blog.yaml#/PublishBlogThemeRequest'
    responses:
      '200':
        description: Theme version published
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Theme published successfully
      '400':
        description: Bad request - version missing or not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
            example:
              error: version must be positive
      '401':
        description: Unauthorized - invalid or missing authentication token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '403':
        description: Forbidden - missing the blog write permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/PermissionErrorResponse'
            example:
              error: 'Insufficient permissions: write access to blog required'
              resource: blog
              permission: write
